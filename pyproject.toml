[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pysely"
version = "0.1.0.dev0"
description = "A typed Python SQL query builder inspired by Kysely"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pysely contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.scripts]
pysely = "pysely.cli:main"

[project.urls]
Documentation = "https://pysely.dev"
Repository = "https://github.com/mylesmmurphy/pysely"
Issues = "https://github.com/mylesmmurphy/pysely/issues"

[project.optional-dependencies]
mysql = ["asyncmy>=0.2,<1"]
postgres = ["asyncpg>=0.30,<1"]
sqlite = ["aiosqlite>=0.20,<1"]

[dependency-groups]
docs = ["zensical==0.0.59"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pysely"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["test"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"docs/assets/examples/query.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pysely"]
mypy_path = "src"

[tool.pyright]
include = [
  "src",
  "test/typings",
  "test/fixtures/portable_schema.py",
  "docs/assets/examples",
]
extraPaths = ["docs/assets/examples"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
