name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/pysely test/fixtures/generated.py
      - run: uv run mypy --strict test/typings/portable.py
      - run: uv run pyright src/pysely test/typings/portable.py
      - run: uv run pytest
      - run: uv run python scripts/check_parity.py
      - run: uv build --no-sources

