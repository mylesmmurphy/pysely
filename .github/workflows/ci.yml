name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra sqlite
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/pysely test/fixtures/generated.py test/fixtures/portable_schema.py
      - run: uv run mypy --strict test/typings/portable.py test/typings/portable_schema.py
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python scripts/check_parity.py
      - run: uv build --no-sources

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: pysely
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYSELY_POSTGRES_DSN: postgresql://postgres:pysely@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra postgres
      - run: uv run pytest test/runtime/test_postgres_live.py --dialect postgres

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pysely
          MYSQL_DATABASE: pysely
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppysely"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYSELY_MYSQL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra mysql
      - run: uv run pytest test/runtime/test_mysql_live.py --dialect mysql
