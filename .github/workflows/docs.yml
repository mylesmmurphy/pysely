name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "playground/**"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"
      - "zensical.toml"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "playground/**"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
      - run: uv sync --locked --only-group docs
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci --ignore-scripts --prefix playground
      - run: npm run build --prefix playground
      - run: uv build --wheel --out-dir docs/wheels
      - run: uv run --no-sync zensical build --clean
      - run: python scripts/fingerprint_docs_assets.py
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: playground
      - run: npm run test:e2e --prefix playground
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
