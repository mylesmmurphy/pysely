name: Publish

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          python-version: "3.13"
      - run: python scripts/check_release.py "$GITHUB_REF_NAME"
      - run: uv build --no-sources
      - run: uv venv /tmp/pysely-release
      - run: uv pip install --python /tmp/pysely-release/bin/python dist/*.whl
      - run: /tmp/pysely-release/bin/python -c "import pysely"
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pysely
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
