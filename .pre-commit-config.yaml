repos:
  - repo: local
    hooks:
      - id: pysely-codegen
        name: pysely codegen
        description: Regenerate the playground's typed interface from its schema.
        entry: >-
          uv run pysely codegen docs/assets/examples/schema.py
          --output docs/assets/examples/database.py
        language: system
        pass_filenames: false
        files: ^docs/assets/examples/(schema|database)\.py$
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
