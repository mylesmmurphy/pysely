[project]
site_name = "Pysely"
site_url = "https://pysely.dev"
site_description = "An async-first, typed Python SQL query builder inspired by Kysely."
repo_url = "https://github.com/mylesmmurphy/pysely"
repo_name = "GitHub"
edit_uri = "edit/main/docs/"
copyright = "Released under the <a href=\"https://github.com/mylesmmurphy/pysely/blob/main/LICENSE\">MIT License</a>.<br>Copyright © 2026-present Pysely contributors."
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Queries" = "queries.md" },
  { "Schema and typing" = "typing.md" },
  { "Playground" = "playground.md" },
  { "Dialects" = "dialects.md" },
  { "Project status" = "project-status.md" },
]
extra_css = ["assets/playground-v4.css"]
extra_javascript = [
  "assets/site.js",
  "assets/playground-v5.js",
]

[project.extra]
generator = false

[project.theme]
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
